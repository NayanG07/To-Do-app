<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #0d0d0f;
        --surface: #18181c;
        --surface2: #222228;
        --border: rgba(255,255,255,0.07);
        --border-hover: rgba(255,255,255,0.14);
        --accent: #c8f043;
        --accent-dim: rgba(200,240,67,0.12);
        --accent-hover: #d4f55a;
        --text: #f0efe8;
        --text-muted: #7a7a82;
        --text-dim: #444450;
        --danger: #ff5757;
        --success: #c8f043;
        --radius: 16px;
        --radius-sm: 10px;
      }

      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 0;
        overflow-x: hidden;
      }

      /* Background grid pattern */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
        z-index: 0;
      }

      .container {
        position: relative;
        z-index: 1;
        max-width: 680px;
        margin: 0 auto;
        padding: 3rem 1.5rem 6rem;
      }

      /* Header */
      header {
        margin-bottom: 3rem;
      }

      .header-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--accent-dim);
        border: 1px solid rgba(200,240,67,0.2);
        color: var(--accent);
        font-size: 11px;
        font-family: 'Syne', sans-serif;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 100px;
        margin-bottom: 1.25rem;
      }

      .header-tag::before {
        content: '';
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.7); }
      }

      h1 {
        font-family: 'Syne', sans-serif;
        font-size: clamp(2.2rem, 6vw, 3.2rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      h1 span {
        color: var(--accent);
      }

      .subtitle {
        margin-top: 0.6rem;
        font-size: 15px;
        color: var(--text-muted);
        font-weight: 300;
      }

      /* Input Card */
      .input-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin-bottom: 2.5rem;
        transition: border-color 0.2s;
      }

      .input-card:focus-within {
        border-color: rgba(200,240,67,0.3);
      }

      .text-input-wrap {
        position: relative;
        margin-bottom: 1rem;
      }

      .text-input-wrap input[type="text"] {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        padding: 14px 16px;
        outline: none;
        transition: border-color 0.2s, background 0.2s;
      }

      .text-input-wrap input[type="text"]::placeholder {
        color: var(--text-dim);
      }

      .text-input-wrap input[type="text"]:focus {
        border-color: rgba(200,240,67,0.4);
        background: rgba(200,240,67,0.04);
      }

      /* File Upload */
      .file-upload-label {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface2);
        border: 1px dashed var(--border-hover);
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        margin-bottom: 1rem;
      }

      .file-upload-label:hover {
        border-color: rgba(200,240,67,0.3);
        background: rgba(200,240,67,0.04);
      }

      .file-upload-label .icon {
        width: 32px;
        height: 32px;
        background: var(--border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .file-upload-label svg {
        width: 16px;
        height: 16px;
        stroke: var(--text-muted);
      }

      .file-upload-text {
        flex: 1;
      }

      .file-upload-text .primary {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
      }

      .file-upload-text .secondary {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 1px;
      }

      #imageInput {
        display: none;
      }

      /* Preview */
      #preview {
        display: none;
        width: 100%;
        max-height: 200px;
        object-fit: cover;
        border-radius: var(--radius-sm);
        margin-bottom: 1rem;
        border: 1px solid var(--border);
      }

      /* Add button */
      .add-btn {
        width: 100%;
        background: var(--accent);
        color: #0d0d0f;
        border: none;
        border-radius: var(--radius-sm);
        font-family: 'Syne', sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 14px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .add-btn:hover { background: var(--accent-hover); }
      .add-btn:active { transform: scale(0.98); }

      .add-btn svg {
        width: 16px;
        height: 16px;
        stroke: #0d0d0f;
      }

      /* Status */
      #status {
        font-size: 13px;
        margin-top: 10px;
        min-height: 18px;
        text-align: center;
        transition: all 0.2s;
      }

      #status.error { color: var(--danger); }
      #status.success { color: var(--success); }

      /* Section header */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.25rem;
      }

      .section-title {
        font-family: 'Syne', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      #todo-count {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 11px;
        font-family: 'Syne', sans-serif;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 100px;
      }

      /* Todo items */
      .todo-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .todo-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: border-color 0.2s, transform 0.15s;
        animation: fadeSlideIn 0.3s ease both;
      }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .todo-item:hover {
        border-color: var(--border-hover);
        transform: translateY(-1px);
      }

      .todo-item img {
        width: 100%;
        max-height: 220px;
        object-fit: cover;
        display: block;
        border-bottom: 1px solid var(--border);
      }

      .todo-body {
        padding: 1rem 1.25rem;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .todo-check {
        width: 20px;
        height: 20px;
        border: 1.5px solid var(--border-hover);
        border-radius: 6px;
        flex-shrink: 0;
        margin-top: 1px;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .todo-check:hover {
        border-color: var(--accent);
        background: var(--accent-dim);
      }

      .todo-text {
        font-size: 15px;
        font-weight: 400;
        color: var(--text);
        line-height: 1.55;
        flex: 1;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-dim);
      }

      .empty-icon {
        width: 56px;
        height: 56px;
        border: 1.5px dashed var(--border-hover);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
      }

      .empty-icon svg {
        width: 22px;
        height: 22px;
        stroke: var(--text-dim);
      }

      .empty-state p {
        font-size: 14px;
        color: var(--text-dim);
      }

      /* Loading spinner */
      .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(0,0,0,0.2);
        border-top-color: #0d0d0f;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-tag">Live</div>
        <h1>Your <span>Tasks,</span><br>Sorted.</h1>
        <p class="subtitle">Capture tasks with images. Stay on top of everything.</p>
      </header>

      <div class="input-card">
        <div class="text-input-wrap">
          <input type="text" id="textInput" placeholder="What needs to be done?" autocomplete="off" />
        </div>

        <label class="file-upload-label" for="imageInput">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <div class="file-upload-text">
            <div class="primary" id="fileLabel">Attach an image</div>
            <div class="secondary">PNG, JPG, GIF up to 10MB</div>
          </div>
        </label>
        <input type="file" id="imageInput" accept="image/*" />

        <img id="preview" alt="preview" />

        <button class="add-btn" id="addBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span id="btnLabel">Add Task</span>
          <div class="spinner" id="spinner"></div>
        </button>

        <p id="status"></p>
      </div>

      <div class="section-header">
        <span class="section-title">Tasks</span>
        <span id="todo-count">0 items</span>
      </div>

      <div id="todos" class="todo-list"></div>
    </div>

    <script>
      const textInput = document.getElementById('textInput');
      const imageInput = document.getElementById('imageInput');
      const preview = document.getElementById('preview');
      const addBtn = document.getElementById('addBtn');
      const status = document.getElementById('status');
      const todosDiv = document.getElementById('todos');
      const fileLabel = document.getElementById('fileLabel');
      const spinner = document.getElementById('spinner');
      const btnLabel = document.getElementById('btnLabel');
      const todoCount = document.getElementById('todo-count');

      imageInput.addEventListener('change', () => {
        const file = imageInput.files[0];
        if (!file) {
          preview.style.display = 'none';
          fileLabel.textContent = 'Attach an image';
          return;
        }
        fileLabel.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      addBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
          showStatus('Please enter a task.', 'error');
          textInput.focus();
          return;
        }

        setLoading(true);
        const form = new FormData();
        form.append('text', text);
        if (imageInput.files[0]) form.append('photo', imageInput.files[0]);

        try {
          const res = await fetch('/todos', { method: 'POST', body: form });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to add task');
          showStatus('Task added!', 'success');
          textInput.value = '';
          imageInput.value = '';
          preview.style.display = 'none';
          fileLabel.textContent = 'Attach an image';
          loadTodos();
        } catch (err) {
          showStatus('Error: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      });

      textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addBtn.click();
      });

      function setLoading(on) {
        addBtn.disabled = on;
        spinner.style.display = on ? 'block' : 'none';
        btnLabel.textContent = on ? 'Adding…' : 'Add Task';
      }

      function showStatus(msg, type) {
        status.textContent = msg;
        status.className = type;
        if (type === 'success') {
          setTimeout(() => { status.textContent = ''; status.className = ''; }, 2500);
        }
      }

      async function loadTodos() {
        try {
          const res = await fetch('/todos');
          const todos = await res.json();

          todoCount.textContent = todos.length === 0 ? '0 items' : `${todos.length} item${todos.length !== 1 ? 's' : ''}`;

          if (todos.length === 0) {
            todosDiv.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                    <rect x="9" y="3" width="6" height="4" rx="1"/>
                    <path d="M9 12h6M9 16h4"/>
                  </svg>
                </div>
                <p>No tasks yet. Add your first one above.</p>
              </div>`;
            return;
          }

          todosDiv.innerHTML = '';
          todos.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'todo-item';
            div.style.animationDelay = `${i * 40}ms`;

            if (t.image) {
              div.innerHTML += `<img src="${t.image}" alt="task image" loading="lazy">`;
            }

            div.innerHTML += `
              <div class="todo-body">
                <div class="todo-check" title="Mark complete"></div>
                <span class="todo-text">${escapeHtml(t.text)}</span>
              </div>`;

            todosDiv.appendChild(div);
          });
        } catch (err) {
          todosDiv.innerHTML = `<p style="color:var(--danger);font-size:14px;text-align:center;padding:2rem">Could not load tasks. Is the server running?</p>`;
        }
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      loadTodos();
    </script>
  </body>
</html>
